name: Docker Images Saver

on:
  push:
    branches: [ main ]
    paths:
      - '**'
  workflow_dispatch:
    inputs:
      arch:
        description: 'Architecture to build'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - amd64
          - arm64

jobs:
  backup:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Latest Rclone
        run: |
          sudo -v ; curl https://rclone.org/install.sh | sudo bash

      - name: Detect Architecture
        id: detect_arch
        run: |
          MANUAL_ARCH="${{ github.event.inputs.arch }}"
          
          if [ "$MANUAL_ARCH" = "arm64" ]; then
            echo "Building ARM64 images (manual)"
            echo "platform=linux/arm64" >> $GITHUB_OUTPUT
            echo "arch_suffix=arm64" >> $GITHUB_OUTPUT
          elif [ "$MANUAL_ARCH" = "amd64" ]; then
            echo "Building AMD64 images (manual)"
            echo "platform=linux/amd64" >> $GITHUB_OUTPUT
            echo "arch_suffix=amd64" >> $GITHUB_OUTPUT
          else
            # 自动检测是否是 arm64 文件夹的推送
            CHANGED_FILES="${{ github.event.head_commit.modified }} ${{ github.event.head_commit.added }}"
            if echo "$CHANGED_FILES" | grep -q "arm64/"; then
              echo "Building ARM64 images (auto)"
              echo "platform=linux/arm64" >> $GITHUB_OUTPUT
              echo "arch_suffix=arm64" >> $GITHUB_OUTPUT
            else
              echo "Building AMD64 images (auto)"
              echo "platform=linux/amd64" >> $GITHUB_OUTPUT
              echo "arch_suffix=amd64" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Pull and Package Images
        id: pack
        run: |
          PLATFORM="${{ steps.detect_arch.outputs.platform }}"
          ARCH_SUFFIX="${{ steps.detect_arch.outputs.arch_suffix }}"
          
          if [ "$ARCH_SUFFIX" = "arm64" ]; then
            cd arm64
          fi
          
          # 1. 检查是否存在 compose 文件并获取镜像名（精华提取）
          if ! docker compose config > /dev/null 2>&1; then
            echo "Warning: No valid docker-compose.yml found or it's empty in $(pwd). Skipping."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          IMAGES=$(docker compose config --images | sort -u | xargs)
          
          if [ -z "$IMAGES" ]; then
            echo "Warning: No images found in docker-compose.yml. Skipping."
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # 2. 拉取镜像（指定平台）
          docker compose pull

          echo "Building for platform: $PLATFORM"
          echo "Images to process: $IMAGES"
          
          # 3. 提取项目名称（优先级顺序）
          PROJECT_NAME=""
          
          # 方法1：尝试从 docker-compose.yaml 中提取 name 字段
          if [ -f docker-compose.yaml ]; then
            PROJECT_NAME=$(grep -E "^name:" docker-compose.yaml | head -1 | awk '{print $2}' | tr -d '"' | tr -d "'")
          fi
          
          # 方法2：如果没有 name 字段，尝试提取第一个服务名
          if [ -z "$PROJECT_NAME" ]; then
            PROJECT_NAME=$(docker compose config --services | head -1)
          fi
          
          # 方法3：使用目录名
          if [ -z "$PROJECT_NAME" ]; then
            PROJECT_NAME=$(basename "$(pwd)")
          fi
          
          # 方法4：默认回退名称
          if [ -z "$PROJECT_NAME" ]; then
            PROJECT_NAME="docker-images"
          fi
          
          # 清理项目名称，移除特殊字符，转为小写
          PROJECT_NAME=$(echo "$PROJECT_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_-]/-/g')
          
          echo "Project name: $PROJECT_NAME"
          
          # 4. 为指定平台拉取镜像
          for IMAGE in $IMAGES; do
            echo "Pulling $IMAGE for $PLATFORM"
            docker pull --platform=$PLATFORM $IMAGE
          done
          
          # 5. 生成文件名：<项目名>-<架构>-<时间戳>.tar.gz
          FILENAME="${PROJECT_NAME}-${ARCH_SUFFIX}-$(date +%Y%m%d%H%M).tar.gz"
          echo "Packing images: $IMAGES"
          echo "Output filename: $FILENAME"
          
          # 6. 流式打包并压缩
          docker save $IMAGES | gzip > "$FILENAME"
          
          # 如果在子目录中，则回退到上一级
          if [ "$ARCH_SUFFIX" = "arm64" ]; then
            cd ..
            FILENAME="arm64/$FILENAME"
          fi
          
          # 导出文件名供后续步骤调用
          echo "filename=$FILENAME" >> $GITHUB_OUTPUT

      - name: Upload via Rclone
        if: steps.pack.outputs.skip != 'true'
        env:
          RCLONE_CONF_DATA: ${{ secrets.RCLONE_CONF_REAL_CONTENT }}
          RCLONE_UPLOAD_PATH: ${{ secrets.RCLONE_UPLOAD_PATH }}
        run: |
          # 1. 通过环境变量生成临时配置文件
          printf "%s" "$RCLONE_CONF_DATA" > rclone_tmp.conf
          
          # 2. 执行上传
          rclone --config ./rclone_tmp.conf copy \
            "${{ steps.pack.outputs.filename }}" \
            "$RCLONE_UPLOAD_PATH" \
            --progress \
            -vv
          
          rm rclone_tmp.conf
